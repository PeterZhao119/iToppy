[package]
name = "itoppy"
version = "0.1.0"
description = "Cute AI coding agent desktop pets"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "itoppy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
